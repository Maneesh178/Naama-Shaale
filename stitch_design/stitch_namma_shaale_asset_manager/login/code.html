<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - Namma-Shaale Inventory</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Public+Sans:wght@600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "error": "#ba1a1a",
                    "tertiary-fixed-dim": "#ffb95f",
                    "on-primary-fixed-variant": "#00468c",
                    "surface-bright": "#f8f9ff",
                    "surface": "#f8f9ff",
                    "primary-fixed-dim": "#a9c7ff",
                    "outline": "#727783",
                    "on-secondary-fixed": "#00210f",
                    "inverse-on-surface": "#eaf1ff",
                    "on-primary": "#ffffff",
                    "surface-container-lowest": "#ffffff",
                    "on-tertiary-fixed": "#2a1700",
                    "surface-container-low": "#eff4ff",
                    "on-error-container": "#93000a",
                    "tertiary": "#663f00",
                    "surface-variant": "#d3e4fe",
                    "secondary-container": "#97f3b5",
                    "on-primary-container": "#c8daff",
                    "surface-container-highest": "#d3e4fe",
                    "on-surface-variant": "#424752",
                    "on-secondary-container": "#047240",
                    "error-container": "#ffdad6",
                    "on-tertiary-fixed-variant": "#653e00",
                    "on-secondary-fixed-variant": "#00522d",
                    "primary": "#00478d",
                    "primary-fixed": "#d6e3ff",
                    "on-tertiary": "#ffffff",
                    "outline-variant": "#c2c6d4",
                    "secondary": "#006d3d",
                    "surface-container-high": "#dce9ff",
                    "on-surface": "#0b1c30",
                    "on-background": "#0b1c30",
                    "tertiary-container": "#865400",
                    "primary-container": "#005eb8",
                    "surface-container": "#e5eeff",
                    "on-tertiary-container": "#ffd29e",
                    "secondary-fixed": "#9af6b8",
                    "on-primary-fixed": "#001b3d",
                    "surface-tint": "#005db6",
                    "inverse-primary": "#a9c7ff",
                    "on-secondary": "#ffffff",
                    "tertiary-fixed": "#ffddb8",
                    "secondary-fixed-dim": "#7ed99e",
                    "background": "#f8f9ff",
                    "on-error": "#ffffff",
                    "inverse-surface": "#213145",
                    "surface-dim": "#cbdbf5"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "card-padding": "24px",
                    "base": "8px",
                    "gutter": "16px",
                    "margin-mobile": "16px",
                    "touch-target-min": "48px"
            },
            "fontFamily": {
                    "display-lg": ["Public Sans"],
                    "headline-md": ["Public Sans"],
                    "label-md": ["Inter"],
                    "body-md": ["Inter"],
                    "title-lg": ["Inter"],
                    "body-lg": ["Inter"],
                    "label-lg": ["Inter"]
            },
            "fontSize": {
                    "display-lg": ["32px", {"lineHeight": "40px", "fontWeight": "700"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "label-md": ["11px", {"lineHeight": "16px", "fontWeight": "500"}],
                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "title-lg": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "label-lg": ["12px", {"lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500"}]
            }
          }
        }
      }
    </script>
<style>
        .material-symbols-outlined {
          font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Subtle QR-inspired geometric pattern for Gov-Tech feel */
        .bg-inventory-pattern {
            background-image: radial-gradient(theme('colors.primary') 1px, transparent 1px), radial-gradient(theme('colors.primary') 1px, transparent 1px);
            background-size: 24px 24px;
            background-position: 0 0, 12px 12px;
            opacity: 0.05;
        }
        /* Hide scrollbar for clean look */
        ::-webkit-scrollbar { display: none; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface antialiased min-h-screen flex items-center justify-center relative overflow-hidden p-margin-mobile">
<!-- Decorative Background Pattern -->
<div class="absolute inset-0 bg-inventory-pattern pointer-events-none z-0"></div>
<!-- Main Login Card Container (Elevation Level 1) -->
<main class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-[0_2px_4px_rgba(0,0,0,0.04)] border border-outline-variant/30 p-card-padding z-10 flex flex-col relative">
<!-- Header / Branding -->
<div class="flex flex-col items-center mb-10 mt-4">
<div class="w-16 h-16 bg-primary-container rounded-2xl flex items-center justify-center mb-4 transform rotate-3">
<span class="material-symbols-outlined text-primary text-4xl transform -rotate-3">inventory_2</span>
</div>
<h1 class="font-display-lg text-display-lg text-primary text-center tracking-tight">Namma-Shaale</h1>
<p class="font-headline-md text-headline-md text-on-surface mt-6 text-center">Welcome Back</p>
<p class="font-body-md text-body-md text-on-surface-variant text-center mt-2 max-w-[280px]">Securely manage your school's assets and inventory.</p>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-6 w-full">
<!-- Input Field (Material 3 Filled Style) -->
<div class="relative bg-surface-container-highest rounded-t-lg border-b-2 border-outline-variant hover:bg-surface-variant focus-within:border-primary focus-within:bg-surface-container transition-all group">
<label class="absolute top-2 left-4 font-label-md text-label-md text-on-surface-variant group-focus-within:text-primary transition-colors cursor-text" for="identifier">
                    Mobile Number or Email
                </label>
<div class="flex items-center px-4 pt-6 pb-2">
<span class="material-symbols-outlined text-on-surface-variant mr-3 group-focus-within:text-primary transition-colors" style="font-size: 20px;">person</span>
<input autocomplete="username" class="w-full bg-transparent font-body-lg text-body-lg text-on-surface border-none focus:outline-none focus:ring-0 p-0 placeholder-transparent" id="identifier" placeholder="Mobile Number or Email" type="text"/>
</div>
</div>
<!-- Primary Action Button -->
<button class="w-full min-h-[56px] bg-primary text-on-primary rounded-full font-label-lg text-label-lg flex items-center justify-center gap-2 mt-4 hover:bg-surface-tint shadow-[0_4px_8px_rgba(0,0,0,0.08)] active:scale-[0.98] transition-all" type="button">
                Send OTP
                <span class="material-symbols-outlined" style="font-size: 20px;">arrow_forward</span>
</button>
<!-- Secondary Action / Toggle -->
<button class="w-full py-3 font-label-lg text-label-lg text-primary hover:text-surface-tint transition-colors bg-transparent border-none outline-none cursor-pointer" type="button">
                Login with Password
            </button>
</form>
<!-- Divider -->
<div class="w-full h-px bg-outline-variant/50 my-6"></div>
<!-- Footer Utilities -->
<div class="flex items-center justify-between w-full">
<button class="flex items-center gap-1.5 font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-colors bg-transparent border-none outline-none" type="button">
<span class="material-symbols-outlined" style="font-size: 16px;">help</span>
                Help
            </button>
<button class="flex items-center gap-1.5 font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-colors bg-transparent border-none outline-none" type="button">
<span class="material-symbols-outlined" style="font-size: 16px;">language</span>
                English
                <span class="material-symbols-outlined" style="font-size: 16px;">expand_more</span>
</button>
</div>
</main>
<!-- Bottom contextual hint (Optional, adds to Gov-Tech trust) -->
<div class="absolute bottom-6 left-0 w-full text-center pointer-events-none px-4">
<p class="font-label-md text-label-md text-outline">An official initiative for educational infrastructure management.</p>
</div>
</body></html>
