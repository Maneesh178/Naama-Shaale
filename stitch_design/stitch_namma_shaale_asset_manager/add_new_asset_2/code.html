<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Add Asset - Namma-Shaale Inventory</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Public+Sans:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary": "#ffffff",
                        "error": "#ba1a1a",
                        "surface-container": "#e5eeff",
                        "on-secondary-fixed-variant": "#00522d",
                        "on-primary": "#ffffff",
                        "on-secondary-fixed": "#00210f",
                        "on-background": "#0b1c30",
                        "primary-fixed-dim": "#a9c7ff",
                        "surface-container-low": "#eff4ff",
                        "on-primary-fixed-variant": "#00468c",
                        "tertiary": "#663f00",
                        "tertiary-fixed": "#ffddb8",
                        "surface-container-highest": "#d3e4fe",
                        "on-surface": "#0b1c30",
                        "surface-bright": "#f8f9ff",
                        "surface-tint": "#005db6",
                        "primary": "#00478d",
                        "outline-variant": "#c2c6d4",
                        "secondary": "#006d3d",
                        "on-secondary-container": "#047240",
                        "error-container": "#ffdad6",
                        "on-surface-variant": "#424752",
                        "secondary-fixed": "#9af6b8",
                        "on-error": "#ffffff",
                        "secondary-fixed-dim": "#7ed99e",
                        "primary-fixed": "#d6e3ff",
                        "inverse-surface": "#213145",
                        "background": "#f8f9ff",
                        "inverse-primary": "#a9c7ff",
                        "on-primary-container": "#c8daff",
                        "on-tertiary-fixed": "#2a1700",
                        "outline": "#727783",
                        "surface-variant": "#d3e4fe",
                        "secondary-container": "#97f3b5",
                        "surface-dim": "#cbdbf5",
                        "on-error-container": "#93000a",
                        "on-primary-fixed": "#001b3d",
                        "tertiary-fixed-dim": "#ffb95f",
                        "surface-container-lowest": "#ffffff",
                        "inverse-on-surface": "#eaf1ff",
                        "surface-container-high": "#dce9ff",
                        "surface": "#f8f9ff",
                        "on-tertiary-container": "#ffd29e",
                        "tertiary-container": "#865400",
                        "primary-container": "#005eb8",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-fixed-variant": "#653e00"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "card-padding": "20px",
                        "touch-target-min": "48px",
                        "base": "8px",
                        "gutter": "16px",
                        "margin-mobile": "16px"
                    },
                    "fontFamily": {
                        "title-lg": ["Inter"],
                        "headline-md": ["Public Sans"],
                        "label-lg": ["Inter"],
                        "body-lg": ["Inter"],
                        "display-lg": ["Public Sans"],
                        "label-md": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "title-lg": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "label-lg": ["12px", {"lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "display-lg": ["32px", {"lineHeight": "40px", "fontWeight": "700"}],
                        "label-md": ["11px", {"lineHeight": "16px", "fontWeight": "500"}],

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen pb-[100px] pt-[70px]">
<!-- TopAppBar: Transactional, so standard nav shell is suppressed, using simplified header -->
<header class="fixed top-0 w-full z-50 bg-surface shadow-sm">
<div class="flex items-center justify-between px-margin-mobile h-touch-target-min w-full max-w-7xl mx-auto">
<button class="flex items-center justify-center w-touch-target-min h-touch-target-min text-on-surface-variant hover:bg-surface-container-highest transition-colors rounded-full active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary">Add Asset</h1>
<div class="w-touch-target-min h-touch-target-min"></div> <!-- Spacer for balance -->
</div>
<!-- Progress Indicator -->
<div class="w-full bg-surface-container-low flex h-2"><div class="w-1/2 bg-primary h-full rounded-r-full"></div><div class="w-1/2 bg-transparent h-full"></div></div>
</header>
<main class="max-w-3xl mx-auto px-margin-mobile mt-gutter">
<div class="mb-gutter"><p class="font-title-lg text-title-lg text-primary">Step 1 of 2: Basic Details</p></div>
<form class="space-y-6">
<!-- Asset Name -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1 font-semibold" for="assetName">Asset Name</label>
<input class="w-full h-touch-target-min px-4 bg-surface-container-low border-b border-outline-variant rounded-t-lg focus:outline-none focus:border-primary focus:ring-0 font-body-lg text-body-lg text-on-surface transition-colors" id="assetName" placeholder="e.g. Dell Optiplex Desktop" type="text"/>
</div>
<!-- Category -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1 font-semibold" for="category">Category</label>
<div class="relative">
<select class="w-full h-touch-target-min px-4 appearance-none bg-surface-container-low border-b border-outline-variant rounded-t-lg focus:outline-none focus:border-primary focus:ring-0 font-body-lg text-body-lg text-on-surface transition-colors" id="category">
<option disabled="" selected="" value="">Select Category</option>
<option value="electronics">Electronics &amp; Computers</option>
<option value="furniture">Furniture</option>
<option value="lab">Lab Equipment</option>
<option value="sports">Sports Equipment</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="arrow_drop_down">arrow_drop_down</span>
</div>
</div>
</div>
<!-- Serial Number & Scan -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1 font-semibold" for="serialNumber">Serial Number</label>
<div class="flex gap-4">
<input class="flex-1 h-touch-target-min px-4 bg-surface-container-low border-b border-outline-variant rounded-t-lg focus:outline-none focus:border-primary focus:ring-0 font-body-lg text-body-lg text-on-surface transition-colors" id="serialNumber" placeholder="Enter S/N" type="text"/>
<button class="flex items-center justify-center gap-2 h-touch-target-min border border-outline text-primary font-label-lg text-label-lg rounded-full hover:bg-surface-container-highest transition-colors active:scale-95 px-6" type="button"><span class="material-symbols-outlined text-2xl" data-icon="barcode_scanner">barcode_scanner</span><span class="font-label-lg">Scan</span></button>
</div>
</div>
<!-- Upload Photo -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1 font-semibold">Asset Photo</label>
<div class="w-full h-48 bg-surface-container border border-dashed border-outline-variant rounded-xl flex flex-col items-center justify-center gap-2 cursor-pointer hover:bg-surface-container-highest transition-colors">
<div class="w-12 h-12 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center">
<span class="material-symbols-outlined text-2xl" data-icon="add_a_photo">add_a_photo</span>
</div>
<span class="font-body-md text-body-md text-on-surface-variant">Tap to upload photo</span>
</div>
</div>
</form>
<!-- Bottom Action -->
<div class="fixed bottom-0 left-0 w-full p-margin-mobile bg-surface shadow-[0_-1px_4px_rgba(0,0,0,0.04)] pb-safe">
<div class="max-w-3xl mx-auto flex justify-end">
<button class="w-full md:w-auto h-[56px] px-8 bg-primary text-on-primary font-label-lg text-label-lg rounded-full hover:bg-surface-tint transition-colors active:scale-95 flex items-center justify-center gap-2 shadow-sm" type="button">
                    Next
                    <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</div>
</main>
</body></html>
